name: Standards change
description: Propose a change to an organization engineering standard or shared workflow.
title: "docs(standards): "
labels: ["standards"]
body:
  - type: dropdown
    id: standard
    attributes:
      label: Standard or workflow
      options:
        - ARCHITECTURE
        - REPOSITORIES
        - CODE-STYLE
        - API-CONTRACTS
        - AGENTS-AND-SKILLS
        - MCP-STANDARDS
        - IDENTITY-AND-AUTH
        - TESTING
        - CI-CD
        - TERRAFORM
        - SECURITY
        - OBSERVABILITY
        - DOCUMENTATION
        - RELEASES
        - A reusable workflow or template
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: What problem does the current rule cause, or what risk does it leave open?
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Effect on existing repositories
      description: Which repositories must change, and can they adopt it incrementally?
    validations:
      required: true
