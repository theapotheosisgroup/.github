name: Bug report
description: Something does not work as documented.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, tokens, real customer data or production identifiers. Use synthetic data.
        Security vulnerabilities go through the [security policy](https://github.com/theapotheosisgroup/.github/blob/main/SECURITY.md), not an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including error messages and logs (redacted).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release, image digest or commit SHA where you saw it.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - CI
        - Develop / preview
        - Production
        - Not sure
    validations:
      required: true
