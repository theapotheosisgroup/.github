name: Feature request
description: Propose new behaviour or a change to existing behaviour.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Name the repository that owns the behaviour, if you know it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: Tick everything that applies. Each ticked item needs a note in the proposal.
      options:
        - label: Changes a published API, event or MCP tool contract
        - label: Changes authorization, identity or data access
        - label: Needs infrastructure changes
        - label: Needs an architecture decision record (ADR)
